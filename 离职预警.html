<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 离职风险预警仪表盘</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --card-2: #10182f;
      --accent: #00d9a5;
      --accent-soft: rgba(0, 217, 165, 0.14);
      --text: #eef3ff;
      --muted: #9ca8c4;
      --line: rgba(255,255,255,0.1);
      --red: #ff4757;
      --orange: #ffa502;
      --green: #2ed573;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(0,217,165,0.14), transparent 34rem),
        var(--bg);
      color: var(--text);
    }

    header {
      background: #121225;
      border-bottom: 1px solid var(--line);
      padding: 24px clamp(18px, 4vw, 48px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 38px);
      letter-spacing: 0;
    }

    h1 span { color: var(--accent); }

    .header-pill {
      color: var(--accent);
      border: 1px solid rgba(0,217,165,0.35);
      background: var(--accent-soft);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px clamp(16px, 3vw, 36px) 40px;
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 24px;
    }

    .panel {
      background: rgba(22, 33, 62, 0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.22);
    }

    .form-panel { padding: 22px; }

    .panel-title {
      margin: 0 0 18px;
      font-size: 18px;
      color: var(--text);
    }

    .quick-select {
      display: grid;
      gap: 9px;
      margin-bottom: 20px;
    }

    .quick-select button {
      border: 1px solid rgba(0,217,165,0.35);
      color: var(--text);
      background: rgba(0,217,165,0.08);
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .quick-select button:hover {
      transform: translateY(-1px);
      background: rgba(0,217,165,0.16);
      border-color: var(--accent);
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    input, select {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 6px;
      background: #0e1630;
      color: var(--text);
      padding: 12px 12px;
      font: inherit;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,217,165,0.12);
    }

    .analyze-btn {
      margin-top: 8px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #071611;
      padding: 14px 16px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
    }

    .analyze-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .results-panel {
      padding: 22px;
      display: grid;
      gap: 20px;
      min-height: 620px;
    }

    .empty-state {
      min-height: 570px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      border: 1px dashed rgba(255,255,255,0.14);
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      padding: 28px;
    }

    .results-content {
      display: none;
      animation: fadeUp .35s ease both;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      align-items: stretch;
    }

    .score-card, .chart-card, .suggestions, .history-panel {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .score-card {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 14px;
    }

    .ring-wrap {
      position: relative;
      width: 190px;
      height: 190px;
    }

    .ring-wrap svg {
      width: 190px;
      height: 190px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 16;
    }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-dasharray: 502.65;
      stroke-dashoffset: 502.65;
      transition: stroke .25s ease;
    }

    .score-number {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 46px;
      font-weight: 900;
    }

    .risk-badge {
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .04em;
      color: #111;
    }

    .employee-line {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .chart-card canvas {
      width: 100%;
      height: 330px;
      display: block;
    }

    .suggestions {
      margin-top: 20px;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .suggestion-card {
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      min-height: 145px;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .suggestion-icon {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .suggestion-icon svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .suggestion-card h3 {
      margin: 0;
      font-size: 15px;
    }

    .suggestion-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .result-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .export-btn {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #071611;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .history-panel {
      grid-column: 1 / -1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
    }

    th, td {
      padding: 13px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    tr:last-child td { border-bottom: 0; }

    .score-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      padding: 5px 8px;
      border-radius: 999px;
      color: #111;
      font-weight: 800;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 30;
    }

    .modal {
      width: min(820px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #fff;
      color: #172033;
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }

    .modal-header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .close-btn {
      border: 1px solid rgba(255,255,255,0.35);
      background: transparent;
      color: #fff;
      border-radius: 6px;
      padding: 8px 11px;
      cursor: pointer;
    }

    .report-body {
      padding: 24px;
    }

    .report-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 16px 0 22px;
    }

    .report-box {
      border: 1px solid #dce1ee;
      border-radius: 8px;
      padding: 12px;
      background: #f7f9fc;
    }

    .report-box strong {
      display: block;
      margin-bottom: 4px;
    }

    .report-score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      border-radius: 8px;
      background: #eefbf8;
      border: 1px solid #c9f5e9;
      margin-bottom: 20px;
    }

    .report-score b {
      font-size: 42px;
    }

    .report-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 24px 24px;
    }

    .print-btn {
      border: 0;
      border-radius: 6px;
      background: #00d9a5;
      color: #071611;
      padding: 11px 15px;
      font-weight: 800;
      cursor: pointer;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 940px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        grid-template-columns: 1fr;
      }

      .results-grid {
        grid-template-columns: 1fr;
      }

      .suggestion-grid {
        grid-template-columns: 1fr;
      }

      .chart-card canvas {
        height: 300px;
      }

      .report-meta {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body * { visibility: hidden; }

      .modal, .modal * { visibility: visible; }

      .modal {
        position: absolute;
        inset: 0;
        width: 100%;
        max-height: none;
        box-shadow: none;
        border-radius: 0;
      }

      .modal-header, .report-actions {
        display: none;
      }

      .modal-backdrop {
        display: block !important;
        position: static;
        background: #fff;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>AI</span> 离职风险预警仪表盘</h1>
    <div class="header-pill">员工保留智能分析</div>
  </header>

  <main>
    <section class="panel form-panel">
      <h2 class="panel-title">员工信息录入</h2>

      <div class="quick-select" aria-label="员工样本">
        <button type="button" data-sample="high">EMP001 张三（高危）</button>
        <button type="button" data-sample="low">EMP002 李四（低危）</button>
        <button type="button" data-sample="medium">EMP003 王五（中危）</button>
      </div>

      <form id="riskForm">
        <label>
          员工姓名
          <input id="employeeName" type="text" value="张三" required />
        </label>

        <label>
          所属部门
          <select id="department">
            <option>技术部</option>
            <option>销售部</option>
            <option>产品部</option>
            <option>运营部</option>
          </select>
        </label>

        <label>
          司龄（年）
          <input id="tenure" type="number" min="0" max="30" step="1" value="3" required />
        </label>

        <label>
          绩效趋势
          <select id="performance">
            <option>上升</option>
            <option>稳定</option>
            <option selected>下滑</option>
          </select>
        </label>

        <label>
          近三个月请假天数
          <input id="leaveDays" type="number" min="0" max="30" step="1" value="12" required />
        </label>

        <label>
          加班变化
          <select id="overtime">
            <option>增加 20% 及以上</option>
            <option>稳定</option>
            <option selected>下降 20% 及以上</option>
          </select>
        </label>

        <label>
          登录频率变化
          <select id="login">
            <option>增加 10% 及以上</option>
            <option>稳定</option>
            <option selected>下降 10% 及以上</option>
          </select>
        </label>

        <label>
          内部转岗申请
          <select id="transfer">
            <option selected>是</option>
            <option>否</option>
          </select>
        </label>

        <button class="analyze-btn" type="submit">分析风险</button>
      </form>
    </section>

    <section class="panel results-panel">
      <div id="emptyState" class="empty-state">
        请选择样本员工，或录入员工行为信号后进行风险分析。
      </div>

      <div id="resultsContent" class="results-content">
        <div class="results-grid">
          <article class="score-card">
            <h2 class="panel-title">风险评分</h2>
            <div class="ring-wrap" aria-label="风险评分">
              <svg viewBox="0 0 190 190">
                <circle class="ring-bg" cx="95" cy="95" r="80"></circle>
                <circle id="ringProgress" class="ring-progress" cx="95" cy="95" r="80"></circle>
              </svg>
              <div id="scoreNumber" class="score-number">0</div>
            </div>
            <div id="riskBadge" class="risk-badge">低危</div>
            <div id="employeeLine" class="employee-line"></div>
          </article>

          <article class="chart-card">
            <h2 class="panel-title">风险维度雷达图</h2>
            <canvas id="radarCanvas" width="760" height="360"></canvas>
          </article>
        </div>

        <section class="suggestions">
          <h2 class="panel-title">AI 挽留建议</h2>
          <div id="suggestionGrid" class="suggestion-grid"></div>
          <div class="result-actions">
            <button id="exportBtn" class="export-btn" type="button">导出报告</button>
          </div>
        </section>
      </div>

      <section class="history-panel">
        <h2 class="panel-title">近期分析记录</h2>
        <table>
          <thead>
            <tr>
              <th>员工</th>
              <th>部门</th>
              <th>评分</th>
              <th>等级</th>
              <th>日期</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="5" style="color: var(--muted);">暂无分析记录。</td></tr>
          </tbody>
        </table>
      </section>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="reportTitle">离职风险分析报告</h2>
        <button id="closeModal" class="close-btn" type="button">关闭</button>
      </div>
      <div id="reportBody" class="report-body"></div>
      <div class="report-actions">
        <button class="print-btn" type="button" onclick="window.print()">打印报告</button>
      </div>
    </div>
  </div>

  <script>
    const samples = {
      high: {
        employeeName: "张三",
        department: "技术部",
        tenure: 3,
        performance: "下滑",
        leaveDays: 12,
        overtime: "下降 20% 及以上",
        login: "下降 10% 及以上",
        transfer: "是"
      },
      low: {
        employeeName: "李四",
        department: "产品部",
        tenure: 11,
        performance: "上升",
        leaveDays: 1,
        overtime: "稳定",
        login: "稳定",
        transfer: "否"
      },
      medium: {
        employeeName: "王五",
        department: "销售部",
        tenure: 5,
        performance: "稳定",
        leaveDays: 8,
        overtime: "下降 20% 及以上",
        login: "稳定",
        transfer: "否"
      }
    };

    const form = document.getElementById("riskForm");
    const emptyState = document.getElementById("emptyState");
    const resultsContent = document.getElementById("resultsContent");
    const scoreNumber = document.getElementById("scoreNumber");
    const ringProgress = document.getElementById("ringProgress");
    const riskBadge = document.getElementById("riskBadge");
    const employeeLine = document.getElementById("employeeLine");
    const suggestionGrid = document.getElementById("suggestionGrid");
    const historyBody = document.getElementById("historyBody");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const reportBody = document.getElementById("reportBody");
    const canvas = document.getElementById("radarCanvas");
    const ctx = canvas.getContext("2d");

    let history = [];
    let latestResult = null;
    const circumference = 2 * Math.PI * 80;

    document.querySelectorAll("[data-sample]").forEach(button => {
      button.addEventListener("click", () => {
        fillForm(samples[button.dataset.sample]);
      });
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      const employee = readForm();
      const result = analyzeRisk(employee);
      latestResult = result;

      emptyState.style.display = "none";
      resultsContent.style.display = "block";

      renderResult(result);
      addHistory(result);
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      if (!latestResult) return;
      renderReport(latestResult);
      modalBackdrop.style.display = "flex";
    });

    document.getElementById("closeModal").addEventListener("click", () => {
      modalBackdrop.style.display = "none";
    });

    modalBackdrop.addEventListener("click", event => {
      if (event.target === modalBackdrop) modalBackdrop.style.display = "none";
    });

    function fillForm(data) {
      Object.entries(data).forEach(([key, value]) => {
        document.getElementById(key).value = value;
      });
    }

    function readForm() {
      return {
        employeeName: document.getElementById("employeeName").value.trim(),
        department: document.getElementById("department").value,
        tenure: Number(document.getElementById("tenure").value),
        performance: document.getElementById("performance").value,
        leaveDays: Number(document.getElementById("leaveDays").value),
        overtime: document.getElementById("overtime").value,
        login: document.getElementById("login").value,
        transfer: document.getElementById("transfer").value
      };
    }

    function analyzeRisk(employee) {
      let score = 30;
      const factors = [];

      if (employee.performance === "下滑") {
        score += 20;
        factors.push("绩效趋势出现下滑，可能存在工作状态或岗位匹配风险。");
      }

      if (employee.leaveDays > 5) {
        const leaveAdd = Math.min((employee.leaveDays - 5) * 5, 25);
        score += leaveAdd;
        factors.push("近三个月请假天数超过常规水平。");
      }

      if (employee.leaveDays > 10) {
        score += 10;
        factors.push("请假天数超过高风险阈值。");
      }

      if (employee.overtime === "下降 20% 及以上") {
        score += 15;
        factors.push("加班参与度明显下降。");
      }

      if (employee.login === "下降 10% 及以上") {
        score += 15;
        factors.push("系统登录频率下降，可能反映参与度降低。");
      }

      if (employee.transfer === "是") {
        score += 20;
        factors.push("存在内部转岗申请，显示岗位流动意向。");
      }

      if (employee.tenure === 3 || employee.tenure === 5) {
        score += 10;
        factors.push("司龄处于典型离职高峰节点。");
      }

      if (employee.tenure > 10) {
        score -= 10;
        factors.push("长期司龄对稳定性具有正向影响。");
      }

      score = Math.max(0, Math.min(100, score));

      const level = score > 80 ? "高危" : score >= 60 ? "中危" : "低危";
      const color = score > 80 ? "#ff4757" : score >= 60 ? "#ffa502" : "#2ed573";

      return {
        employee,
        score,
        level,
        color,
        factors,
        dimensions: buildDimensions(employee),
        suggestions: buildSuggestions(employee, score),
        date: new Date()
      };
    }

    function buildDimensions(employee) {
      return [
        { label: "绩效", value: employee.performance === "下滑" ? 88 : employee.performance === "稳定" ? 45 : 20 },
        { label: "出勤", value: Math.min(100, employee.leaveDays * 7) },
        { label: "司龄风险", value: employee.tenure === 3 || employee.tenure === 5 ? 80 : employee.tenure > 10 ? 18 : 42 },
        { label: "加班", value: employee.overtime === "下降 20% 及以上" ? 82 : employee.overtime === "稳定" ? 35 : 20 },
        { label: "活跃度", value: employee.login === "下降 10% 及以上" ? 82 : employee.login === "稳定" ? 36 : 20 },
        { label: "转岗信号", value: employee.transfer === "是" ? 90 : 18 }
      ];
    }

    function buildSuggestions(employee, score) {
      const items = [];

      if (employee.performance === "下滑") {
        items.push(["trend", "直属上级一对一沟通", "安排直属上级进行深度沟通，识别绩效下滑原因，明确支持资源与 30 天改进计划。"]);
      }

      if (employee.leaveDays > 5 || employee.overtime === "下降 20% 及以上") {
        items.push(["calendar", "工作量与身心健康评估", "评估近期项目压力、工作负荷和恢复时间，必要时提供弹性安排或资源调配。"]);
      }

      if (employee.login === "下降 10% 及以上") {
        items.push(["activity", "敬业度回访", "了解协作摩擦、工具障碍或参与度下降原因，并将员工重新连接到关键任务与团队节奏。"]);
      }

      if (employee.transfer === "是") {
        items.push(["move", "职业发展路径沟通", "沟通内部流动诉求与职业目标，在外部机会形成前提供清晰的发展路径。"]);
      }

      if (employee.tenure === 3 || employee.tenure === 5) {
        items.push(["milestone", "关键人才保留计划", "围绕司龄高峰节点开展薪酬回顾、成长规划、认可激励与关键人才保留动作。"]);
      }

      if (items.length < 3 && score < 60) {
        items.push(["check", "持续认可与反馈机制", "保持稳定的认可节奏、成长反馈和岗位目标澄清，延续低风险状态。"]);
      }

      while (items.length < 3) {
        items.push(["target", "定向挽留方案", "结合成长机会、管理支持、工作负荷调整和激励资源，制定个性化挽留方案。"]);
      }

      return items.slice(0, 3);
    }

    function renderResult(result) {
      employeeLine.textContent = `${result.employee.employeeName} | ${result.employee.department}`;
      riskBadge.textContent = result.level;
      riskBadge.style.background = result.color;
      ringProgress.style.stroke = result.color;
      animateScore(result.score);
      renderSuggestions(result.suggestions);
      drawRadar(result.dimensions, result.color);
    }

    function animateScore(target) {
      const duration = 900;
      const startTime = performance.now();

      function tick(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = Math.round(target * eased);
        scoreNumber.textContent = value;
        ringProgress.style.strokeDashoffset = circumference - (circumference * value / 100);
        if (progress < 1) requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    function renderSuggestions(items) {
      suggestionGrid.innerHTML = items.map(([icon, title, text]) => `
        <article class="suggestion-card">
          <div class="suggestion-icon">${iconSvg(icon)}</div>
          <h3>${escapeHtml(title)}</h3>
          <p>${escapeHtml(text)}</p>
        </article>
      `).join("");
    }

    function iconSvg(type) {
      const icons = {
        trend: '<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"></path><path d="M14 7h7v7"></path></svg>',
        calendar: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>',
        activity: '<svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"></path></svg>',
        move: '<svg viewBox="0 0 24 24"><path d="M7 7h11l-4-4"></path><path d="M17 17H6l4 4"></path></svg>',
        milestone: '<svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"></path></svg>',
        check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>',
        target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>'
      };
      return icons[type] || icons.target;
    }

    function drawRadar(dimensions, color) {
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2 + 8;
      const radius = Math.min(width, height) * 0.34;
      const points = dimensions.length;
      const start = performance.now();

      function frame(now) {
        const progress = Math.min((now - start) / 850, 1);
        const eased = 1 - Math.pow(1 - progress, 3);

        ctx.clearRect(0, 0, width, height);
        ctx.lineWidth = 1;
        ctx.font = "14px system-ui, Microsoft YaHei, sans-serif";

        for (let ring = 1; ring <= 5; ring++) {
          ctx.beginPath();
          for (let i = 0; i < points; i++) {
            const angle = -Math.PI / 2 + i * Math.PI * 2 / points;
            const r = radius * ring / 5;
            const x = centerX + Math.cos(angle) * r;
            const y = centerY + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.strokeStyle = "rgba(255,255,255,0.12)";
          ctx.stroke();
        }

        dimensions.forEach((dimension, i) => {
          const angle = -Math.PI / 2 + i * Math.PI * 2 / points;
          const x = centerX + Math.cos(angle) * radius;
          const y = centerY + Math.sin(angle) * radius;

          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(x, y);
          ctx.strokeStyle = "rgba(255,255,255,0.1)";
          ctx.stroke();

          const labelX = centerX + Math.cos(angle) * (radius + 42);
          const labelY = centerY + Math.sin(angle) * (radius + 28);
          ctx.fillStyle = "#c9d3ea";
          ctx.textAlign = labelX < centerX - 10 ? "right" : labelX > centerX + 10 ? "left" : "center";
          ctx.textBaseline = "middle";
          ctx.fillText(dimension.label, labelX, labelY);
        });

        ctx.beginPath();
        dimensions.forEach((dimension, i) => {
          const angle = -Math.PI / 2 + i * Math.PI * 2 / points;
          const r = radius * (dimension.value * eased) / 100;
          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = hexToRgba(color, 0.24);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.fill();
        ctx.stroke();

        dimensions.forEach((dimension, i) => {
          const angle = -Math.PI / 2 + i * Math.PI * 2 / points;
          const r = radius * (dimension.value * eased) / 100;
          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        });

        if (progress < 1) requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    function addHistory(result) {
      history.unshift(result);
      history = history.slice(0, 5);

      historyBody.innerHTML = history.map(item => `
        <tr>
          <td>${escapeHtml(item.employee.employeeName)}</td>
          <td>${escapeHtml(item.employee.department)}</td>
          <td><span class="score-chip" style="background:${item.color}">${item.score}</span></td>
          <td>${item.level}</td>
          <td>${formatDate(item.date)}</td>
        </tr>
      `).join("");
    }

    function renderReport(result) {
      reportBody.innerHTML = `
        <h2>员工离职风险摘要</h2>
        <div class="report-meta">
          <div class="report-box"><strong>员工姓名</strong>${escapeHtml(result.employee.employeeName)}</div>
          <div class="report-box"><strong>所属部门</strong>${escapeHtml(result.employee.department)}</div>
          <div class="report-box"><strong>司龄</strong>${result.employee.tenure} 年</div>
          <div class="report-box"><strong>报告日期</strong>${formatDate(result.date)}</div>
        </div>

        <div class="report-score">
          <div>
            <strong>风险等级</strong>
            <div style="font-size:22px;font-weight:900;color:${result.color};">${result.level}</div>
          </div>
          <b style="color:${result.color};">${result.score}/100</b>
        </div>

        <h3>关键风险信号</h3>
        <ul>
          ${result.factors.length ? result.factors.map(factor => `<li>${escapeHtml(factor)}</li>`).join("") : "<li>未检测到显著高风险信号。</li>"}
        </ul>

        <h3>建议挽留措施</h3>
        <ol>
          ${result.suggestions.map(item => `<li><strong>${escapeHtml(item[1])}：</strong>${escapeHtml(item[2])}</li>`).join("")}
        </ol>
      `;
    }

    function formatDate(date) {
      return date.toLocaleString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function hexToRgba(hex, alpha) {
      const value = hex.replace("#", "");
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    fillForm(samples.high);
  </script>
